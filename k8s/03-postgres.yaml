---
# PersistentVolumeClaim: disco do Postgres.
# Sem isso, apagar o Pod do banco apagaria todos os dados.
# No Minikube a StorageClass "standard" provisiona o volume automaticamente.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  labels:
    app.kubernetes.io/part-of: sono
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
# Deployment do PostgreSQL 17.
# Uma réplica só: é um banco com disco ReadWriteOnce, duas réplicas
# brigariam pelo mesmo volume. A alta disponibilidade exigida pela
# rúbrica é demonstrada no backend e no frontend.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
    app.kubernetes.io/part-of: sono
spec:
  replicas: 1
  strategy:
    type: Recreate          # não subir um Pod novo antes de matar o antigo (disco único)
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            # PGDATA em uma subpasta: o volume montado tem um "lost+found"
            # na raiz e o Postgres se recusa a inicializar em diretório não vazio.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: sono-secrets
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "sono", "-d", "sono"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "sono", "-d", "sono"]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data

---
# Service do banco: ClusterIP.
# ClusterIP = só acessível de dentro do cluster. O banco não fica exposto
# para fora, que é exatamente o que queremos.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
    app.kubernetes.io/part-of: sono
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
