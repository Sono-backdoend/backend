---
# Secret: credenciais e segredos da aplicação.
#
# ATENÇÃO (o ponto que o Kauã avisou):
#  - Use stringData, não data. Em "data" os valores PRECISAM estar em base64;
#    em "stringData" você escreve texto puro e o Kubernetes codifica sozinho.
#  - NÃO coloque aqui nenhuma variável NEXT_PUBLIC_*. Elas são embutidas no
#    bundle do Next DURANTE O BUILD da imagem; definidas no Pod, não têm efeito.
#  - O host do banco é "postgres" porque é o nome do Service. Dentro do cluster
#    o DNS resolve esse nome; "localhost" aqui apontaria para o próprio Pod.
apiVersion: v1
kind: Secret
metadata:
  name: sono-secrets
  labels:
    app.kubernetes.io/part-of: sono
type: Opaque
stringData:
  # --- Credenciais do Postgres (consumidas pelo container do banco) ---
  POSTGRES_USER: "sono"
  POSTGRES_PASSWORD: "sono123"
  POSTGRES_DB: "sono"

  # --- Conexões usadas pelo backend ---
  # DATABASE_URL: usada em runtime pelo adapter @prisma/adapter-pg (lib/prisma.ts)
  DATABASE_URL: "postgresql://sono:sono123@postgres:5432/sono?schema=public"
  # DATABASE_URL_UNPOOLED: usada pelo prisma.config.ts, nas migrations
  DATABASE_URL_UNPOOLED: "postgresql://sono:sono123@postgres:5432/sono?schema=public"

  # --- NextAuth v5 ---
  # Troque por um valor seu: openssl rand -base64 32
  AUTH_SECRET: "Jb1oOsNxdtTF9ytUgs0b2jJtres3zO+zK8KYlksD6kg="

  # --- Admin criado pelo seed (prisma/seed.ts) ---
  ADMIN_EMAIL: "admin@fightclub.com"
  ADMIN_PASSWORD: "lSEVqgoWOaAqnxYE"
  ADMIN_NAME: "Admin"
